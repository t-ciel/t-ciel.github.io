*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6fa;color:#1e293b}
header{background:#071632;color:#fff;text-align:center}
.hero{position:relative;width:100%;overflow:hidden;background:#071632}
.hero picture,.hero img{display:block;width:100%}
.hero img{height:clamp(120px,9.5vw,195px);object-fit:cover;object-position:center}
@media(max-width:767px) and (orientation:portrait){.hero img{height:clamp(220px,78vw,400px);object-fit:cover}}
@media(max-width:1100px) and (orientation:landscape){.hero img{height:auto;object-fit:initial}}
.version{position:fixed;right:12px;bottom:8px;font-size:11px;color:#718096;opacity:.8;pointer-events:none}

.portal-profile{padding:16px 20px;text-align:center;background:#e8f1fc;border-bottom:1px solid #b9d3f0}
.portal-profile h1{font-size:clamp(24px,4vw,34px);margin:0 0 5px;color:#103e75}
.portal-profile p{margin:0;color:#355779}
.portal-test-note{max-width:1100px;margin:18px auto 0;padding:12px 18px;border:1px solid #b7c9dc;border-radius:9px;background:#fff;color:#24425e}

.raccourcis{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;min-height:35px;padding:5px 12px;background:#e9eff6;border-bottom:1px solid #cbd7e5;font:13px/1.3 Arial,sans-serif}
.raccourcis a{display:inline-flex;align-items:center;gap:5px;color:#173b65;text-decoration:none;font-weight:700;padding:3px 8px;border-radius:5px}
.raccourcis a:hover,.raccourcis a:focus-visible{background:#d1e2f5;text-decoration:underline}
.raccourcis a:focus-visible{outline:2px solid #215fa6;outline-offset:2px}
.raccourcis svg{width:12px;height:12px;flex:none}
.raccourcis .favicon{width:auto;height:20px;max-width:65px;object-fit:contain;flex:none}
@media(max-width:767px){.raccourcis .favicon{display:none}}
@media(prefers-color-scheme:dark){.raccourcis{background:#1c293a;border-bottom-color:#3b506b}.raccourcis a{color:#d2e7ff}.raccourcis a:hover,.raccourcis a:focus-visible{background:#2e4663}}

.portail-bandeau{position:relative;isolation:isolate;overflow:hidden;background:#071632}
.portail-bandeau picture,.portail-bandeau img{display:block;width:100%}
.portail-bandeau img{height:clamp(120px,9.5vw,195px);object-fit:cover;object-position:center}
.portail-bandeau-titre{position:absolute;z-index:1;left:4%;bottom:13%;max-width:75%;margin:0;padding:0;color:#fff;font:700 clamp(20px,2.45vw,34px)/1.17 Arial,sans-serif;text-align:left;text-shadow:0 2px 7px #061222,0 1px 2px #061222}
@media(max-width:767px) and (orientation:portrait){.portail-bandeau img{height:clamp(220px,78vw,400px);object-fit:cover}.portail-bandeau-titre{left:5%;bottom:7%;max-width:90%;font-size:clamp(16px,4.4vw,24px)}}
@media(max-width:1100px) and (orientation:landscape){.portail-bandeau img{height:auto;object-fit:contain}.portail-bandeau-titre{bottom:9%;font-size:clamp(16px,2.6vw,27px)}}
