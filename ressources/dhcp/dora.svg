<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc"><title id="title">Les quatre échanges DORA</title><desc id="desc">Le PC à gauche envoie Discover puis Request vers le serveur DHCP à droite. Le serveur renvoie Offer puis Ack vers le PC. Les lettres DORA sont alignées.</desc><style>@media (prefers-color-scheme:dark){.dora-texte{fill:#eaf3ff}}</style><defs><marker id="bleu" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L11 5.5L0 11Z" fill="#1478ec"/></marker><marker id="vert" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L11 5.5L0 11Z" fill="#169b48"/></marker></defs><g font-family="Arial,sans-serif"><g transform="translate(26 126)"><rect x="0" y="0" width="190" height="118" rx="9" fill="#253447" stroke="#101e2d" stroke-width="5"/><rect x="11" y="11" width="168" height="94" fill="#1688e2"/><path d="M8 123h175l20 23H-12Z" fill="#607a93"/><text x="95" y="200" font-size="35" font-weight="700" text-anchor="middle" class="dora-texte" fill="#14263a">PC</text></g><g transform="translate(826 113)"><rect width="143" height="150" rx="10" fill="#344457" stroke="#172539" stroke-width="5"/><g fill="#182535"><rect x="14" y="18" width="114" height="23" rx="4"/><rect x="14" y="56" width="114" height="23" rx="4"/><rect x="14" y="94" width="114" height="23" rx="4"/></g><g fill="#53ce68"><circle cx="114" cy="29" r="6"/><circle cx="114" cy="67" r="6"/><circle cx="114" cy="105" r="6"/></g><text x="71" y="202" font-size="31" font-weight="700" text-anchor="middle" class="dora-texte" fill="#14263a">Serveur DHCP</text></g><g font-size="40" font-weight="700"><text x="359" y="66" fill="#1478ec">D</text><text x="359" y="154" fill="#169b48">O</text><text x="359" y="242" fill="#1478ec">R</text><text x="359" y="330" fill="#169b48">A</text></g><g font-size="28" class="dora-texte" fill="#14263a"><text x="437" y="65">Discover</text><text x="437" y="153">Offer</text><text x="437" y="241">Request</text><text x="437" y="329">Ack</text></g><g fill="none" stroke-width="7" stroke-linecap="round"><path d="M285 83H767" stroke="#1478ec" marker-end="url(#bleu)"/><path d="M767 171H285" stroke="#169b48" marker-end="url(#vert)"/><path d="M285 259H767" stroke="#1478ec" marker-end="url(#bleu)"/><path d="M767 347H285" stroke="#169b48" marker-end="url(#vert)"/></g></g></svg>