<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1800" height="600" viewBox="0 0 1800 600" role="img" aria-label="Dix Post-it colorés avec mots liés au cahier des charges informatique">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <linearGradient id="paperSheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.05"/>
    </linearGradient>
    <style><![CDATA[
      .note-base { stroke: rgba(0,0,0,0.08); stroke-width: 1.5; }
      .ink1 { font-family: "Comic Sans MS", "Trebuchet MS", cursive; font-weight: 700; }
      .ink2 { font-family: "Bradley Hand", "Segoe Print", cursive; font-weight: 700; }
      .ink3 { font-family: "Verdana", "Arial", sans-serif; font-weight: 700; letter-spacing: 0.5px; }
      .ink4 { font-family: "Lucida Handwriting", "Segoe Script", cursive; font-weight: 700; }
      .word { fill: #171717; font-size: 48px; dominant-baseline: middle; text-anchor: middle; }
      .small { font-size: 42px; }
      .long { font-size: 39px; }
      .uline { fill: none; stroke: #171717; stroke-width: 7; stroke-linecap: round; opacity: 0.92; }
      .shine { fill: url(#paperSheen); pointer-events: none; }
      .fold-shadow { fill: rgba(0,0,0,0.10); }
    ]]></style>
  </defs>

  <!-- note 1 -->
  <g transform="translate(55 58) rotate(-7 120 120)" filter="url(#shadow)">
    <rect class="note-base" x="0" y="0" width="240" height="240" rx="3" fill="#FFEB19"/>
    <path class="shine" d="M0,0 H240 V240 H0 Z"/>
    <path d="M188 199 L240 188 L240 240 L196 240 Q188 239 188 230 Z" fill="#F3D910"/>
    <path class="fold-shadow" d="M188 199 L215 213 L240 188 L208 195 Z"/>
    <text x="120" y="98" class="word ink2">Besoins</text>
    <path class="uline" d="M58 150 C100 141, 141 133, 181 138"/>
  </g>

  <!-- note 2 -->
